plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.80'
}

group = project.mod_group
version = project.mod_version

base { archivesName = project.mod_id }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { inventorycleanup { sourceSet sourceSets.main } }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.theillusivec4.top/' }
}

dependencies {
    implementation 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-AoutRefMapFile=${layout.buildDirectory.file('tmp/compileJava/inventorycleanup.refmap.json').get().asFile}"]
}

jar {
    from(layout.buildDirectory.file('tmp/compileJava/inventorycleanup.refmap.json'))
    manifest.attributes([
        'MixinConfigs': 'inventorycleanup.mixins.json',
        'Implementation-Version': project.version
    ])
}
